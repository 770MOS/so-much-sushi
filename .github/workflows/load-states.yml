name: Load a source by state

# Loads a source state by state: each state is its own load, reconciled before the next one
# starts, so "missing from 2 loads of the same area" always compares like with like.
#   production: the whole country (waits for your Approve click)
#   staging:    the free sandbox holds 500 MB, so a few states at most
# Safe to run again with the same inputs: states already done for that release are skipped,
# and a run that hit the 6-hour limit carries on where it stopped.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which database"
        type: choice
        options: [staging, production]
        default: staging
      source:
        description: "Which source (both: Overture first, then All the Places)"
        type: choice
        options: [both, overture_places, alltheplaces]
        default: both
      states:
        description: "'all' (production only), or two-letter codes like VA,MD,DC. 'none' = records with no state"
        default: "DC"
      release:
        description: "Overture release (All the Places always uses its latest run)"
        default: "2026-09-23.1"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.target }}
    # One thing at a time per database: a production load never overlaps a production deploy.
    concurrency:
      group: ${{ inputs.target == 'production' && 'production-db' || 'ingest-sandbox' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      STATES: ${{ inputs.states }}
      DATABASE_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}
      DB_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_DB_URL || secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the target
        run: |
          if [ "$TARGET" = production ]; then ref=ajkgveeuurzltttdfhgv; name=PRODUCTION_DB_URL; else ref=mfngcidhbzjexbxtgbeh; name=STAGING_DB_URL; fi
          if [ -z "$DATABASE_URL" ]; then echo "::error title=Missing secret::Add $name to the $TARGET environment."; exit 1; fi
          case "$DATABASE_URL" in *$ref*) ;; *) echo "::error title=Wrong database::$name does not point at $TARGET ($ref). Refusing to run."; exit 1 ;; esac
          if [ "$TARGET" = staging ] && [ "$(echo "$STATES" | tr '[:upper:]' '[:lower:]' | tr -d ' ')" = all ]; then
            echo "::error title=Too big for staging::The sandbox holds 500 MB; the country needs about 13 GB. Give a few states, e.g. VA,MD,DC."; exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.5.6 "psycopg[binary]>=3.2,<4"

      - name: Overture Places
        if: inputs.source == 'both' || inputs.source == 'overture_places'
        env:
          RELEASE: ${{ inputs.release }}
        run: python scripts/ingest/overture_places.py --mode load --release="$RELEASE" --states="$STATES"

      - name: All the Places
        if: inputs.source == 'both' || inputs.source == 'alltheplaces'
        run: python scripts/ingest/alltheplaces.py --mode load --states="$STATES"

      - name: What is there now
        if: always()
        run: |
          docker pull -q postgres:17 >/dev/null
          scripts/db/psql.sh -f scripts/db/inventory.sql | scripts/db/report.sh "$TARGET after the load"
