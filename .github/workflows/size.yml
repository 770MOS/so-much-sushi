name: Size up a source (places per state)

# Counts food and drink places per state across the United States for one source and
# estimates the database space a load would need. Reads only; touches no database.
# The table appears on the run's summary page and as a CSV download.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which source"
        type: choice
        options: [overture_places, alltheplaces]
        default: overture_places
      release:
        description: "Overture release (All the Places always uses its latest run)"
        default: "2026-09-23.1"

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.5.6 "psycopg[binary]>=3.2,<4"
      - name: Count places per state
        env:
          SOURCE: ${{ inputs.source }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$SOURCE" = overture_places ]; then
            python scripts/ingest/overture_places.py --mode size --release="$RELEASE"
          else
            python scripts/ingest/alltheplaces.py --mode size
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.source }}-places-per-state
          path: sizing.csv
          if-no-files-found: ignore
