name: Ingest Overture Places (sandbox)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only reads and summarises; load writes to the sandbox"
        type: choice
        options: [dry-run, load]
        default: dry-run
      release:
        description: "Overture release"
        default: "2026-09-23.1"
      bbox:
        description: "xmin,ymin,xmax,ymax (default: DC, Arlington, Alexandria and inner suburbs)"
        default: "-77.25,38.75,-76.90,39.05"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.5.6
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ inputs.mode == 'load' && secrets.SANDBOX_SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.mode == 'load' && secrets.SANDBOX_SUPABASE_SERVICE_ROLE_KEY || '' }}
          MODE: ${{ inputs.mode }}
          RELEASE: ${{ inputs.release }}
          BBOX: ${{ inputs.bbox }}
        run: python scripts/ingest/overture_places.py --mode "$MODE" --release="$RELEASE" --bbox="$BBOX"
      - uses: actions/upload-artifact@v4
        with:
          name: overture-places-${{ inputs.mode }}
          path: overture_places.csv
          retention-days: 14
